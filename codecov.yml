coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default

ignore:
  - "src/**/__test__/**"
  - "src/**/types/**"
  - "src/compat/types.ts"
  - "src/**/*.d.ts"
