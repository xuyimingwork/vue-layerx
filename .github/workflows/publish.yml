name: Publish

on:
  workflow_dispatch:

# 默认最小权限；各 job 再按需提升
permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve tag and version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 main 2>/dev/null || git tag -l 'v*' --merged main | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ] || [[ ! "$LATEST_TAG" =~ ^v ]]; then
            echo "No valid v tag found on main branch"
            exit 1
          fi

          # 以 tag 指向的 commit 为准（tag 可能被挪过）
          git checkout --quiet "$LATEST_TAG"

          VERSION="${LATEST_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($VERSION) does not match package.json version ($PKG_VERSION) at $LATEST_TAG"
            exit 1
          fi

          # 预发布版本使用对应 dist-tag，避免污染 latest
          if [[ "$PKG_VERSION" =~ -(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
            NPM_TAG="${BASH_REMATCH[1]}"
          else
            NPM_TAG="latest"
          fi

          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "Resolved $LATEST_TAG (package.json=$PKG_VERSION, npm dist-tag=$NPM_TAG)"

  publish-npm:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Trusted Publisher (OIDC) 需要此权限生成短期 token
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          # Trusted Publisher 要求 Node >= 22.14；npm@latest(12) 要求 Node ^22.22.2 || ^24.15
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # 仅当 registry 明确返回该 version 时才 skip；查不到 / 网络失败则继续发布
      - name: Check if version already on npm
        id: npm_check
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME=$(node -p "require('./package.json').name")
          if PUBLISHED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null) && [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Package ${NAME}@${VERSION} already published, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Package ${NAME}@${VERSION} not found on npm, will publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.npm_check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Trusted Publisher 要求 npm CLI 11.5.1+
      - name: Setup NPM
        if: steps.npm_check.outputs.skip != 'true'
        run: npm install -g npm@latest

      # prepublishOnly: run-p test:unit + test:integration:all（后者自带 build；集成消费 dist）
      # --provenance: 生成供应链溯源证明
      # --tag: 预发布打 beta/alpha/rc，正式版打 latest
      - name: Publish To NPM
        if: steps.npm_check.outputs.skip != 'true'
        run: npm publish --provenance --access public --tag ${{ needs.resolve.outputs.npm_tag }}

  github-release:
    needs: [resolve, publish-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
